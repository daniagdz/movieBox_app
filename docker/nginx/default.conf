
server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        #cuando no se encuentra ruta pedida redirige a 404
        try_files $uri =404;

        #redirige al puerto 9000
        fastcgi_pass app:9000; 

        # define archivo por defecto si se accede a un directorio PHP
        fastcgi_index index.php;

        #cargamos variables estandar del protocolo FascCGI (http, get, post, IP cliente ...)
        include fastcgi_params;

        #indica a php-fpm la ruta en el sistema donde se guarda el .php a ejecutar
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
